<!doctype html>
<html lang="zh-CN" data-root="..">

    <title>联系我们 · 丝路棉韵</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />

  <body data-page="contact">
    <header class="site-header" id="site-header"></header>

    <main class="page-main">
      <div class="page-hero">
        <div class="container">
          <h1>联系我们</h1>
          <p>欢迎垂询合作、采购与媒体联络，我们将尽快回复您的需求。</p>
        </div>
      </div>

      <div class="container contact-grid">
        <section id="phone" class="contact-card">
          <p class="block-tag">6.1</p>
          <h2>联系电话</h2>
          <p>客服热线：<a href="tel:4008880000">400-888-0000</a></p>
          <p>工作时间：周一至周五 9:00–18:00</p>
        </section>

        <section id="consult" class="contact-card">
          <p class="block-tag">6.2</p>
          <h2>合作咨询入口</h2>
          <p>商务合作与批量定制请发送邮件至：</p>
          <p><a href="mailto:cooperation@example.com">cooperation@example.com</a></p>
          <p>请注明公司名称、合作意向与预计采购量，便于快速对接。</p>
        </section>

        <section id="address" class="contact-card">
          <p class="block-tag">6.3</p>
          <h2>企业地址</h2>
          <p>新疆乌鲁木齐市（示例地址，请替换为实际办公地址）</p>
          <p>邮编：830000</p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 丝路棉韵 · 新疆棉主题网站</div>
